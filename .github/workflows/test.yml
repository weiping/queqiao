name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# On main a run finishes: a release waits for a green run (LESSONS.md).
# A PR's run is cancelled by its next push.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Linux only: Windows checks out CRLF.
      - name: Gofmt
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bad=$(git ls-files -z '*.go' | xargs -0 gofmt -l)
          if [ -n "$bad" ]; then echo "not gofmt'd:"; echo "$bad"; exit 1; fi

      - name: Vet
        run: go vet ./...

      - name: Test
        if: runner.os != 'Windows'
        run: go test -race ./...

      # a timing, measured without the race detector (it slows the proxy
      # several times over); Windows' Test step already runs without it
      - name: Proxy first-byte overhead
        if: runner.os != 'Windows'
        run: go test -count=1 -run '^TestProxyFirstByteOverhead$' -v ./internal/proxy/

      - name: Test (Windows)
        if: runner.os == 'Windows'
        run: go test ./...

      - name: install.sh
        if: runner.os != 'Windows'
        run: sh scripts/install_test.sh

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/install_test.ps1

  pi:
    name: pi extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/pi
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx vitest run
