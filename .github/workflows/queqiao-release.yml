name: queqiao release

# Pushing a qq-v* tag (or dispatching with an existing one) builds the
# terminal-only queqiao for every desktop platform and publishes a GitHub
# Release here, which install.sh downloads from:
#
#   git tag qq-v0.1.0 && git push origin qq-v0.1.0
#
# Plain v* tags are left alone: upstream's release.yml hands those off to
# yetone/magpie-releases, and queqiao is not released from there.

on:
  push:
    tags:
      - 'qq-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing qq-v* tag to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version
        id: v
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          case "$tag" in
            qq-v?*) ;;
            *) echo "bad tag: $tag (want qq-v<version>)" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#qq-v}" >> "$GITHUB_OUTPUT"

      - name: Build the cli for every platform
        run: make release-cli VERSION="${{ steps.v.outputs.tag }}"

      - name: Build the Windows app
        # WebView2 needs no cgo: the tray app cross-compiles right here.
        # Unsigned, like upstream's Windows builds — SmartScreen asks once.
        run: make release-windows VERSION="${{ steps.v.outputs.tag }}"

      - name: SHA-256 checksums
        run: |
          cd dist
          shasum -a 256 queqiao-cli-* > checksums.txt
          shasum -a 256 queqiao-windows-*.exe | sed 's/$/ ; app/' >> checksums.txt
          cat checksums.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.v.outputs.tag }}" dist/queqiao-cli-* dist/queqiao-windows-*.exe dist/checksums.txt \
            --title "queqiao ${{ steps.v.outputs.version }}" \
            --notes "Terminal build of queqiao ($(git rev-parse --short HEAD)). Install:
          
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/weiping/queqiao/queqiao/install.sh | sh
          \`\`\`
          Windows (PowerShell):
          
          \`\`\`powershell
          irm https://raw.githubusercontent.com/weiping/queqiao/queqiao/install.ps1 | iex
          \`\`\`
          
          Then \`queqiao router init --preset cn\` and \`queqiao serve\`. See the README's 快速开始."

  # The macOS menu bar app, signed and notarised when the Apple secrets
  # are set (see docs/signing.md); an unsigned zip otherwise, whose notes
  # carry the one-line Gatekeeper pass. Like upstream magpie's app, minus
  # its separate releases repo: the secrets live here.
  app:
    needs: cli   # the cli job creates the release; upload into it after
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version
        id: v
        run: |
          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          case "$tag" in
            qq-v?*) ;;
            *) echo "bad tag: $tag (want qq-v<version>)" >&2; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#qq-v}" >> "$GITHUB_OUTPUT"

      - name: Build the app
        run: make app VERSION="${{ steps.v.outputs.tag }}"

      - name: Sign and notarise
        id: sign
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERT_P12" ] || [ -z "$APPLE_API_KEY" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple secrets not set; the app ships unsigned (docs/signing.md lists them)"
            exit 0
          fi
          keychain=build.keychain-db
          security create-keychain -p ci "$keychain"
          security default-keychain -s "$keychain"
          printf '%s' "$APPLE_CERT_P12" | base64 -d > cert.p12
          security import cert.p12 -k "$keychain" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$keychain"
          printf '%s' "$APPLE_API_KEY" | base64 -d > key.p8
          identity=$(security find-identity -v -p codesigning "$keychain" | awk '/Developer ID Application/ {print $2; exit}')
          codesign --force --deep --options runtime --timestamp --sign "$identity" queqiao.app
          codesign --verify --strict queqiao.app
          ditto -c -k --keepParent queqiao.app "queqiao-app-macos.zip"
          xcrun notarytool submit "queqiao-app-macos.zip" --key key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "queqiao-app-macos.zip" || xcrun stapler staple queqiao.app
          # staple goes on the app; the zip is made again so it carries the stapled app
          ditto -c -k --keepParent queqiao.app "queqiao-app-macos.zip"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Zip (unsigned path)
        if: steps.sign.outputs.signed != 'true'
        run: ditto -c -k --keepParent queqiao.app queqiao-app-macos.zip

      - name: Publish the app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          note="Signed and notarised."
          [ "$SIGNED" = "true" ] || note="Unsigned: on first open, run: xattr -dr com.apple.quarantine queqiao.app"
          shasum -a 256 queqiao-app-macos.zip > queqiao-app-macos.zip.sha256
          gh release upload "${{ steps.v.outputs.tag }}" queqiao-app-macos.zip queqiao-app-macos.zip.sha256 --clobber
          gh release edit "${{ steps.v.outputs.tag }}" --notes "queqiao ${{ steps.v.outputs.version }} — $note

          Install (macOS/Linux/Termux):
          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/weiping/queqiao/queqiao/install.sh | sh
          \`\`\`
          Windows (PowerShell):
          \`\`\`powershell
          irm https://raw.githubusercontent.com/weiping/queqiao/queqiao/install.ps1 | iex
          \`\`\`
          The macOS app is queqiao-app-macos.zip (unzip, drag to Applications).

          Then \`queqiao router init --preset cn\` and \`queqiao serve\`. See the README's 快速开始."

  # The Linux tray app links GTK 3 and WebKitGTK 4.1 through cgo: one
  # native job per arch (the arm runner this repo already uses for its
  # docker image). Plain unsigned binaries; on a machine with WebKitGTK
  # installed they are the desktop app, elsewhere use queqiao web.
  linux-app:
    needs: cli
    strategy:
      matrix:
        include:
          - { runs-on: ubuntu-latest,      goarch: amd64 }
          - { runs-on: ubuntu-24.04-arm,   goarch: arm64 }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: GTK 3 and WebKitGTK 4.1
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Version
        id: v
        run: echo "tag=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Build the Linux app
        run: make release-linux VERSION="${{ steps.v.outputs.tag }}"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          f="dist/queqiao-linux-${{ matrix.goarch }}"
          shasum -a 256 "$f" > "$f.sha256"
          gh release upload "${{ steps.v.outputs.tag }}" "$f" "$f.sha256" --clobber
